<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 五十音沉浸式語音循環播放器 | Japanese Kana Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff6b8b;
      --primary-dark: #e0486b;
      --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #ffe6ec 50%, #f0f4ff 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #2d3748;
      --text-muted: #718096;
      --accent: #4fd1c5;
      --shadow: 0 20px 40px -15px rgba(255, 107, 139, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 20px;
      user-select: none;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Header */
    header {
      text-align: center;
    }
    header h1 {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Card */
    .card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-badge {
      position: absolute;
      top: 20px;
      left: 24px;
      background: #ffe3e8;
      color: var(--primary-dark);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .card-counter {
      position: absolute;
      top: 20px;
      right: 24px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .kana-display {
      margin: 20px 0 10px 0;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 24px;
    }

    .hira-char {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 105px;
      font-weight: 900;
      color: var(--primary-dark);
      line-height: 1;
      text-shadow: 2px 4px 12px rgba(255, 107, 139, 0.2);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .hira-char:hover {
      transform: scale(1.06);
    }

    .kata-char {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 56px;
      font-weight: 700;
      color: #a0aec0;
      line-height: 1;
    }

    .romaji-tag {
      background: #edf2f7;
      color: #4a5568;
      font-size: 18px;
      font-weight: 700;
      padding: 4px 18px;
      border-radius: 12px;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .details-box {
      width: 100%;
      background: rgba(247, 250, 252, 0.88);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 14.5px;
      line-height: 1.6;
    }

    .detail-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .detail-label {
      font-weight: 700;
      color: #4a5568;
      min-width: 80px;
      flex-shrink: 0;
    }
    .detail-content {
      color: #2d3748;
    }

    .vocab-highlight {
      background: #fff0f3;
      color: var(--primary-dark);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: #edf2f7;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.3s;
    }

    /* Controls */
    .controls-panel {
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px 24px;
      box-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .playback-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-main {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(255, 107, 139, 0.4);
    }
    .btn-main:hover {
      transform: scale(1.08);
    }
    .btn-main:active {
      transform: scale(0.96);
    }

    .btn-sec {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #edf2f7;
      color: #4a5568;
      font-size: 18px;
    }
    .btn-sec:hover {
      background: #e2e8f0;
      transform: scale(1.06);
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13.5px;
      color: var(--text-muted);
      border-top: 1px solid #edf2f7;
      padding-top: 14px;
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select, .speed-btn {
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #4a5568;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-active {
      background: #ffe3e8 !important;
      color: var(--primary-dark) !important;
      border-color: var(--primary) !important;
    }

    footer {
      font-size: 13px;
      color: #a0aec0;
      text-align: center;
    }
  </style>
</head>
<body>
  <a href="./#/kana" style="position:fixed;top:12px;left:12px;z-index:99;background:#fff;color:#d6456b;border:1px solid #f0c8d4;border-radius:999px;padding:6px 14px;font:600 14px sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08)">← 回道場</a>
  <div class="container">
    <header>
      <h1>🌸 五十音沉浸式語音循環播放器</h1>
      <p>放鬆聆聽・自動翻頁・直覺化記憶 <span id="kanaTotal">46</span> 音</p>
    </header>

    <div class="card" id="card">
      <div class="card-badge" id="badge-row">あ行</div>
      <div class="card-counter" id="counter">1 / 46</div>

      <div class="kana-display">
        <div class="hira-char" id="hira" title="點擊收聽發音">あ</div>
        <div class="kata-char" id="kata">ア</div>
      </div>

      <div class="romaji-tag" id="romaji">a</div>

      <div class="details-box">
        <div class="detail-item">
          <span class="detail-label">📜 漢字字源：</span>
          <span class="detail-content" id="origin">安 (漢字草書「安」的圓潤化)</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">💡 記憶口訣：</span>
          <span class="detail-content" id="mnemonic">看到紅蘋果驚呼：『啊（あ）！好甜的蘋果！』</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">👄 嘴型要訣：</span>
          <span class="detail-content" id="tip">嘴型自然放鬆微張，舌頭平放，輕輕吐氣發音。</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">📖 必學單字：</span>
          <span class="detail-content" id="vocab"><span class="vocab-highlight">朝 (あさ)</span> — 早晨</span>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="playback-buttons">
        <button class="btn btn-sec" id="btn-prev" title="上一個 (←)">⏮️</button>
        <button class="btn btn-main" id="btn-play" title="播放/暫停 (Space)">▶️</button>
        <button class="btn btn-sec" id="btn-next" title="下一個 (→)">⏭️</button>
        <button class="btn btn-sec" id="btn-voice" title="發音開關">🔊</button>
      </div>

      <div class="options-row">
        <div class="option-group">
          <span>📂 行別選擇：</span>
          <select id="select-row">
            <option value="all">全部 46 音 (全循環)</option>
          </select>
        </div>

        <div class="option-group">
          <span>⏱️ 換卡速度：</span>
          <select id="select-speed">
            <option value="2500">2.5 秒 (快速衝刺)</option>
            <option value="4000" selected>4 秒 (舒適沉浸)</option>
            <option value="6000">6 秒 (深度熟記)</option>
            <option value="8000">8 秒 (慢速跟讀)</option>
          </select>
        </div>

        <div class="option-group">
          <button class="speed-btn" id="btn-shuffle" title="隨機模式">🎲 隨機播放</button>
        </div>
      </div>
    </div>

    <footer>
      💡 快捷鍵提示：空白鍵 (播放/暫停) | 方向鍵 ← → (切換假名) | 點擊大假名可重播發音
    </footer>
  </div>

  <script src="data.js"></script>
  <script>
    // 假名資料與主站共用 data.js（由 tools/export_web_data.py 從 data/kana_data.py 產生）
    const KANA_CARDS = window.JP_DATA.kanaCards;
    const KANA_ROWS = Object.values(window.JP_DATA.kanaRows);
    const escHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let currentIndex = 0;
    let isPlaying = false;
    let intervalTimer = null;
    let voiceEnabled = true;
    let isShuffle = false;
    let filterRow = 'all';

    // Elements
    const badgeRow = document.getElementById('badge-row');
    const counter = document.getElementById('counter');
    const hira = document.getElementById('hira');
    const kata = document.getElementById('kata');
    const romaji = document.getElementById('romaji');
    const origin = document.getElementById('origin');
    const mnemonic = document.getElementById('mnemonic');
    const tip = document.getElementById('tip');
    const vocab = document.getElementById('vocab');
    const progress = document.getElementById('progress');

    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnVoice = document.getElementById('btn-voice');
    const btnShuffle = document.getElementById('btn-shuffle');
    const selectRow = document.getElementById('select-row');
    const selectSpeed = document.getElementById('select-speed');

    // 行別選單與數量都從資料算出來，不寫死索引
    selectRow.options[0].textContent = `全部 ${KANA_CARDS.length} 音 (全循環)`;
    document.getElementById('kanaTotal').textContent = KANA_CARDS.length;
    KANA_ROWS.forEach((row, r) => selectRow.add(new Option(row.name, String(r))));

    function getFilteredIndices() {
      const row = KANA_ROWS[Number(filterRow)];
      if (filterRow === 'all' || !row) {
        return KANA_CARDS.map((_, i) => i);
      }
      const set = new Set(row.items.map((it) => it.hira));
      return KANA_CARDS.map((c, i) => (set.has(c.hira) ? i : -1)).filter((i) => i >= 0);
    }

    function renderCard(index) {
      const card = KANA_CARDS[index];
      if (!card) return;

      badgeRow.textContent = card.row;
      counter.textContent = `${index + 1} / ${KANA_CARDS.length}`;
      hira.textContent = card.hira;
      kata.textContent = card.kata;
      romaji.textContent = card.romaji;
      origin.textContent = card.origin;
      mnemonic.textContent = card.mnemonic;
      tip.textContent = card.sound_tip;
      vocab.innerHTML = `<span class="vocab-highlight">${escHtml(card.vocab)}</span> — ${escHtml(card.vocab_tw)}`;

      const pct = ((index + 1) / KANA_CARDS.length) * 100;
      progress.style.width = `${pct}%`;

      if (voiceEnabled) {
        speakKana(card.hira);
      }
    }

    function speakKana(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.rate = 0.85;
      utter.pitch = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function nextCard() {
      const indices = getFilteredIndices();
      if (isShuffle) {
        currentIndex = indices[Math.floor(Math.random() * indices.length)];
      } else {
        const pos = indices.indexOf(currentIndex);
        if (pos === -1 || pos >= indices.length - 1) {
          currentIndex = indices[0];
        } else {
          currentIndex = indices[pos + 1];
        }
      }
      renderCard(currentIndex);
    }

    function prevCard() {
      const indices = getFilteredIndices();
      const pos = indices.indexOf(currentIndex);
      if (pos <= 0) {
        currentIndex = indices[indices.length - 1];
      } else {
        currentIndex = indices[pos - 1];
      }
      renderCard(currentIndex);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        btnPlay.textContent = '⏸️';
        btnPlay.classList.add('toggle-active');
        startTimer();
      } else {
        btnPlay.textContent = '▶️';
        btnPlay.classList.remove('toggle-active');
        clearInterval(intervalTimer);
      }
    }

    function startTimer() {
      clearInterval(intervalTimer);
      const speed = parseInt(selectSpeed.value, 10) || 4000;
      intervalTimer = setInterval(() => {
        nextCard();
      }, speed);
    }

    // Event Listeners
    btnPlay.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', () => {
      nextCard();
      if (isPlaying) startTimer();
    });
    btnPrev.addEventListener('click', () => {
      prevCard();
      if (isPlaying) startTimer();
    });

    btnVoice.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      btnVoice.textContent = voiceEnabled ? '🔊' : '🔇';
      if (voiceEnabled) speakKana(KANA_CARDS[currentIndex].hira);
    });

    btnShuffle.addEventListener('click', () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle('toggle-active', isShuffle);
    });

    selectRow.addEventListener('change', (e) => {
      filterRow = e.target.value;
      const indices = getFilteredIndices();
      currentIndex = indices[0];
      renderCard(currentIndex);
      if (isPlaying) startTimer();
    });

    selectSpeed.addEventListener('change', () => {
      if (isPlaying) startTimer();
    });

    hira.addEventListener('click', () => {
      speakKana(KANA_CARDS[currentIndex].hira);
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        nextCard();
        if (isPlaying) startTimer();
      } else if (e.code === 'ArrowLeft') {
        prevCard();
        if (isPlaying) startTimer();
      }
    });

    // Init
    renderCard(0);
  </script>
</body>
</html>
