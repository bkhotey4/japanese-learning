      border-radius: 6px;
      font-weight: 700;

      height: 6px;
      background: #edf2f7;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 16px;

    let currentIndex = 0;
    let isPlaying = false;
    let intervalTimer = null;
    let voiceEnabled = true;
    let isShuffle = false;
    let filterRow = 'all';

    // Elements
    const badgeRow = document.getElementById('badge-row');
    const counter = document.getElementById('counter');
    const hira = document.getElementById('hira');
    const kata = document.getElementById('kata');
    const romaji = document.getElementById('romaji');
    const origin = document.getElementById('origin');
    const mnemonic = document.getElementById('mnemonic');
    const tip = document.getElementById('tip');
    const vocab = document.getElementById('vocab');
    const progress = document.getElementById('progress');

    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnVoice = document.getElementById('btn-voice');
    const btnShuffle = document.getElementById('btn-shuffle');
    const selectRow = document.getElementById('select-row');
    const selectSpeed = document.getElementById('select-speed');

    function getFilteredIndices() {
      if (filterRow === 'all') {
        return KANA_CARDS.map((_, i) => i);
      }
      const start = parseInt(filterRow, 10);
      let count = 5;
      if (start === 35) count = 3; // ya
      if (start === 38) count = 5; // ra
      if (start === 43) count = 3; // wa
      return Array.from({ length: count }, (_, i) => start + i);
    }

    function renderCard(index) {
      const card = KANA_CARDS[index];
      if (!card) return;

      badgeRow.textContent = card.row;
      counter.textContent = `${index + 1} / ${KANA_CARDS.length}`;
      hira.textContent = card.hira;
      kata.textContent = card.kata;
      romaji.textContent = card.romaji;
      origin.textContent = card.origin;
      mnemonic.textContent = card.mnemonic;
      tip.textContent = card.sound_tip;
      vocab.innerHTML = `<span class="vocab-highlight">${card.vocab}</span> — ${card.vocab_tw}`;

      const pct = ((index + 1) / KANA_CARDS.length) * 100;
      progress.style.width = `${pct}%`;

      if (voiceEnabled) {
        speakKana(card.hira);
      }
    }

    function speakKana(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.rate = 0.85;
      utter.pitch = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function nextCard() {
      const indices = getFilteredIndices();
      if (isShuffle) {
        currentIndex = indices[Math.floor(Math.random() * indices.length)];
      } else {
        const pos = indices.indexOf(currentIndex);
        if (pos === -1 || pos >= indices.length - 1) {
          currentIndex = indices[0];
        } else {
          currentIndex = indices[pos + 1];
        }
      }
      renderCard(currentIndex);
    }

    function prevCard() {
      const indices = getFilteredIndices();
      const pos = indices.indexOf(currentIndex);
      if (pos <= 0) {
        currentIndex = indices[indices.length - 1];
      } else {
        currentIndex = indices[pos - 1];
      }
      renderCard(currentIndex);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        btnPlay.textContent = '⏸️';
        btnPlay.classList.add('toggle-active');
        startTimer();
      } else {
        btnPlay.textContent = '▶️';
        btnPlay.classList.remove('toggle-active');
        clearInterval(intervalTimer);
      }
    }

    function startTimer() {
      clearInterval(intervalTimer);
      const speed = parseInt(selectSpeed.value, 10) || 4000;
      intervalTimer = setInterval(() => {
        nextCard();
      }, speed);
    }

    // Event Listeners
    btnPlay.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', () => {
      nextCard();
      if (isPlaying) startTimer();
    });
    btnPrev.addEventListener('click', () => {
      prevCard();
      if (isPlaying) startTimer();
    });

    btnVoice.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      btnVoice.textContent = voiceEnabled ? '🔊' : '🔇';
      if (voiceEnabled) speakKana(KANA_CARDS[currentIndex].hira);
    });

    btnShuffle.addEventListener('click', () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle('toggle-active', isShuffle);
    });

    selectRow.addEventListener('change', (e) => {
      filterRow = e.target.value;
      const indices = getFilteredIndices();
      currentIndex = indices[0];
      renderCard(currentIndex);
      if (isPlaying) startTimer();
    });

    selectSpeed.addEventListener('change', () => {
      if (isPlaying) startTimer();
    });

    hira.addEventListener('click', () => {
      speakKana(KANA_CARDS[currentIndex].hira);
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        nextCard();
        if (isPlaying) startTimer();
      } else if (e.code === 'ArrowLeft') {
        prevCard();
        if (isPlaying) startTimer();
      }
    });

    // Init
    renderCard(0);
  </script>
